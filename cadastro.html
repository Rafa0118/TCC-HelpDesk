<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpium | Cadastro</title>
    <meta
      name="description"
      content="Tela de cadastro moderna com visual semelhante à tela de login."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/legacy/styles.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <aside class="login-visual" aria-label="Área promocional de cadastro">
        <div class="login-visual-inner">
          <div class="login-copy">
            <p class="login-kicker">Você pode facilmente</p>
            <h1>Organizar seu trabalho<br />com nosso Helpdesk</h1>
          </div>

          
        </div>
      </aside>

      <main class="login-panel">
        <div class="login-form-wrap">
          <h2>Crie sua conta</h2>
          <p class="login-subtitle">Preencha os campos abaixo para começar.</p>

          <form class="login-form" action="#" method="post">
            <div class="login-field">
              <label for="name">Nome</label>
              <input id="name" type="text" placeholder="Digite seu nome completo" />
            </div>

            <div class="login-field">
              <label for="email">E-mail</label>
              <input id="email" type="email" placeholder="seuemail@gmail.com" />
            </div>

            <div class="login-field">
              <div class="password-row">
                <label for="password">Senha</label>
              </div>
              <div class="input-wrap">
                <input id="password" type="password" placeholder="••••••••••" />
                <button class="password-toggle" type="button" aria-label="Mostrar senha">◌</button>
              </div>
            </div>

            <div class="login-field">
              <label for="confirm-password">Confirmar senha</label>
              <div class="input-wrap">
                <input id="confirm-password" type="password" placeholder="••••••••••" />
                <button class="password-toggle confirm-toggle" type="button" aria-label="Mostrar senha">◌</button>
              </div>
            </div>

            <label class="check-row" for="terms">
              <input id="terms" type="checkbox" />
              <span>Concordo com os Termos e a Privacidade</span>
            </label>

            <button class="login-submit" type="submit">Cadastrar</button>
          </form>

          <p class="signup-text">Já tem uma conta? <a href="index.html">Entrar</a></p>

          <div class="divider">ou</div>

          <div class="social-row">
            <button class="social-btn google" type="button">
              <span class="social-icon">G</span>
              <span>Cadastrar com Google</span>
            </button>
            <button class="social-btn apple" type="button">
              <span class="social-icon"></span>
              <span>Cadastrar com Apple</span>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script>
      const passwordFields = document.querySelectorAll('#password, #confirm-password');
      const toggles = document.querySelectorAll('.password-toggle');

      toggles.forEach((toggle, index) => {
        toggle.addEventListener('click', () => {
          const field = passwordFields[index];
          const isHidden = field.type === 'password';
          field.type = isHidden ? 'text' : 'password';
          toggle.textContent = isHidden ? '◉' : '◌';
        });
      });

      const form = document.querySelector('.login-form');
      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const terms = document.getElementById('terms').checked;

        if (!name || !email || !password || !confirmPassword) {
          alert('Preencha todos os campos.');
          return;
        }

        if (password !== confirmPassword) {
          alert('As senhas não coincidem.');
          return;
        }

        if (!terms) {
          alert('Você precisa aceitar os termos e a privacidade.');
          return;
        }

        const users = JSON.parse(localStorage.getItem('helpium_users') || '[]');
        const alreadyExists = users.some((user) => user.email.toLowerCase() === email.toLowerCase());

        if (alreadyExists) {
          alert('Este e-mail já está cadastrado.');
          return;
        }

        users.push({ name, email, password });
        localStorage.setItem('helpium_users', JSON.stringify(users));
        localStorage.setItem('helpium_logged_user', JSON.stringify({ name, email }));

        alert('Cadastro realizado com sucesso!');
        window.location.href = 'home.html';
      });
    </script>
  </body>
</html>
