<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iHelpy | Redefinir senha</title>
    <meta
      name="description"
      content="Solicite um link seguro para redefinir a senha da sua conta HelpDesk."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/legacy/styles.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <aside class="login-visual" aria-label="Área promocional de recuperação de senha">
        <div class="login-visual-inner">
          <div class="login-copy">
            <p class="login-kicker">Acesso seguro</p>
            <h1>Volte ao seu HelpDesk com segurança.</h1>
          </div>
        </div>
      </aside>

      <main class="login-panel">
        <div class="login-form-wrap">
          <h2>Redefinição de senha</h2>
          <p class="login-subtitle">
            Informe o e-mail da sua conta. Se ela estiver cadastrada, enviaremos um link seguro para criar uma nova senha.
          </p>

          <form id="passwordResetForm" class="login-form" novalidate>
            <div class="login-field">
              <label for="email">E-mail da conta</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                maxlength="254"
                required
                placeholder="seuemail@escola.com"
              />
            </div>

            <button id="passwordResetSubmit" class="login-submit" type="submit">
              Enviar link de redefinição
            </button>
          </form>
          <p id="passwordResetFeedback" class="form-feedback" role="status" aria-live="polite"></p>
          <p class="signup-text"><a href="login.html">Voltar para entrar</a></p>
        </div>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="js/core/firebase.js"></script>
    <script src="js/core/password-reset-api.js"></script>
    <script src="js/pages/password-reset.js"></script>
  </body>
</html>
