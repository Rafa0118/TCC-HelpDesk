<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iHelpy | Login</title>
    <meta
      name="description"
      content="Tela de login moderna e inspirada em landing page de SaaS."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/legacy/styles.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <aside class="login-visual" aria-label="Área promocional de login">
        <div class="login-visual-inner">
          <div class="login-copy">
            <p class="login-kicker">Você pode facilmente</p>
            <h1>Organizar seu trabalho<br />com nosso Helpdesk</h1>
          </div>

          
        </div>
      </aside>

      <main class="login-panel">
        <div class="login-form-wrap">
          <h2>Comece agora</h2>
          <p class="login-subtitle">Faça login na sua conta para continuar.</p>

          <form class="login-form" action="#" method="post">
            <div class="login-field">
              <label for="email">E-mail corporativo</label>
              <input id="email" type="email" placeholder="seuemail@empresa.com" />
            </div>

            <div class="login-field">
              <label for="password">Senha</label>
              <div class="input-wrap">
                <input id="password" type="password" placeholder="••••••••••" />
                <button class="password-toggle" type="button" aria-label="Mostrar senha">◌</button>
              </div>
            </div>

            <button class="login-submit" type="submit">Entrar</button>
          </form>

          <button class="support-btn" type="button" onclick="window.location.href='mailto:suporte@helpium.com?subject=Solicita%C3%A7%C3%A3o%20de%20suporte'">
            Entrar em contato com o suporte
          </button>
          <p class="signup-text">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
        </div>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="js/core/firebase.js"></script>
    <script>
      const passwordInput = document.getElementById('password');
      const toggleButton = document.querySelector('.password-toggle');

      toggleButton.addEventListener('click', () => {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        toggleButton.textContent = isHidden ? '◉' : '◌';
      });

      const form = document.querySelector('.login-form');
      form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        try {
          const user = await FirebaseDB.login(email, password);
          if (user.role === 'professor') window.location.href = 'dashboard/professor.html';
          else if (user.role === 'tecnico') window.location.href = 'dashboard/tecnico.html';
          else if (user.role === 'direcao') window.location.href = 'dashboard/direcao.html';
          else throw new Error('O perfil desta conta não é reconhecido.');
        } catch (error) {
          alert(error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found'
            ? 'E-mail ou senha inválidos.'
            : error.message || 'Não foi possível entrar. Verifique sua conexão e tente novamente.');
        }
      });
    </script>
  </body>
</html>
