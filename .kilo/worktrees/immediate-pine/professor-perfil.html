<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpium | Meu Perfil</title>
    <style>
      :root {
        --bg: linear-gradient(135deg, #f3ecff 0%, #f8f5ff 45%, #f2f0ff 100%);
        --bg-strong: #efe6ff;
        --panel: rgba(255, 255, 255, 0.84);
        --panel-strong: #ffffff;
        --surface: #f9f5ff;
        --surface-2: #f1eaff;
        --primary: #7a4ae8;
        --primary-dark: #5d2ad1;
        --primary-soft: #efe6ff;
        --primary-soft-strong: #e3d4ff;
        --text: #1c1b22;
        --muted: #5e5a6d;
        --line: rgba(42, 31, 74, 0.12);
        --line-strong: rgba(42, 31, 74, 0.2);
        --shadow: 0 22px 48px rgba(77, 48, 123, 0.12);
        --shadow-soft: 0 10px 22px rgba(116, 84, 181, 0.12);
        --success: #ebf9ee;
        --success-text: #2f7d4a;
        --progress: #fff3bf;
        --progress-text: #996b00;
        --waiting: #f2edff;
        --waiting-text: #5b2ec4;
        --cancelled: #ffe5e5;
        --cancelled-text: #bf2b2b;
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button, input, textarea, select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .page-shell {
        --sidebar-width: 72px;
        width: 100%;
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: visible;
        backdrop-filter: none;
        transition: grid-template-columns 0.25s ease;
      }

      .page-shell.is-expanded {
        --sidebar-width: 220px;
      }

      .sidebar {
        background: transparent;
        border-right: 1px solid rgba(42, 31, 74, 0.08);
        padding: 18px 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-left: 0;
        width: 72px;
        transition: width 0.25s ease;
        overflow: visible;
      }

      .page-shell.is-expanded .sidebar {
        width: 220px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 8px 18px;
        min-height: 42px;
        color: var(--text);
      }

      .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: linear-gradient(135deg, #1b1b1e 0%, #3a2f49 100%);
        position: relative;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        left: 8px;
        top: 5px;
        background: #fff;
        border-radius: 3px;
        transform: rotate(45deg);
      }

      .nav {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font-size: 0.94rem;
        font-weight: 600;
        height: 42px;
        padding: 0 12px;
        text-align: left;
        transition: all 0.25s ease;
        width: 100%;
        white-space: nowrap;
      }

      .nav-item-text {
        display: inline-block;
        max-width: 0;
        opacity: 0;
        white-space: nowrap;
        transform: translateX(-8px);
        transition: max-width 0.22s ease, opacity 0.18s ease, transform 0.18s ease;
      }

      .page-shell.is-expanded .nav-item-text {
        max-width: 180px;
        opacity: 1;
        transform: translateX(0);
      }

      .nav-item:hover,
      .nav-item:focus-visible {
        background: rgba(122, 74, 232, 0.08);
        border-color: rgba(122, 74, 232, 0.12);
        transform: translateX(2px);
        outline: none;
      }

      .nav-item.active {
        background: linear-gradient(135deg, rgba(122, 74, 232, 0.12), rgba(122, 74, 232, 0.04));
        border-color: rgba(122, 74, 232, 0.16);
        color: var(--primary-dark);
      }

      .nav-icon {
        width: 16px;
        height: 16px;
        position: relative;
        flex-shrink: 0;
      }

      .nav-icon.home::before {
        content: "";
        position: absolute;
        inset: 3px 2px 2px 2px;
        border: 2px solid currentColor;
        border-top: 0;
        border-radius: 3px 3px 5px 5px;
      }

      .nav-icon.home::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        left: 2px;
        top: 0;
        border-left: 2px solid currentColor;
        border-top: 2px solid currentColor;
        transform: rotate(45deg);
      }

      .nav-icon.list::before {
        content: "";
        position: absolute;
        inset: 2px 2px 2px 2px;
        border: 2px solid currentColor;
        border-radius: 4px;
      }

      .nav-icon.list::after {
        content: "";
        position: absolute;
        left: 4px;
        right: 4px;
        top: 6px;
        height: 2px;
        background: currentColor;
        box-shadow: 0 5px 0 currentColor, 0 10px 0 currentColor;
      }

      .nav-icon.plus::before,
      .nav-icon.plus::after {
        content: "";
        position: absolute;
        background: currentColor;
        border-radius: 2px;
      }

      .nav-icon.plus::before {
        left: 7px;
        top: 2px;
        width: 2px;
        height: 12px;
      }

      .nav-icon.plus::after {
        left: 2px;
        top: 7px;
        width: 12px;
        height: 2px;
      }

      .nav-icon.user::before {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        left: 4px;
        top: 1px;
        background: currentColor;
        border-radius: 50%;
      }

      .nav-icon.user::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 8px;
        left: 2px;
        bottom: 1px;
        border-radius: 7px 7px 4px 4px;
        background: currentColor;
      }

      .content {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: transparent;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 78px;
        padding: 18px 28px 10px;
      }

      .header-tools {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .bell {
        position: relative;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.7);
        border-radius: 12px;
        color: var(--text);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .bell:hover,
      .bell:focus-visible {
        transform: translateY(-1px) scale(1.02);
        box-shadow: var(--shadow-soft);
        border-color: rgba(122,74,232,0.2);
        outline: none;
      }

      .bell::before {
        content: "";
        position: absolute;
        width: 14px;
        height: 12px;
        left: 12px;
        top: 11px;
        border: 2px solid currentColor;
        border-bottom: 0;
        border-radius: 10px 10px 0 0;
      }

      .bell::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 4px;
        left: 13px;
        bottom: 11px;
        border-radius: 999px;
        background: currentColor;
      }

      .user-pill {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px 7px 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--line);
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text);
        transition: all 0.25s ease;
      }

      .user-pill:hover {
        border-color: rgba(122, 74, 232, 0.2);
        box-shadow: var(--shadow-soft);
      }

      .avatar {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, #221d2a 0%, #6a4ad3 100%);
        position: relative;
      }

      .avatar::before {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        background: #fff;
        border-radius: 50%;
        left: 5px;
        top: 2px;
      }

      .avatar::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 7px;
        background: #fff;
        border-radius: 8px 8px 4px 4px;
        left: 4px;
        bottom: 2px;
      }

      .main-panel {
        flex: 1;
        padding: 28px;
        overflow-y: auto;
      }

      .profile-container {
        max-width: 900px;
        margin: 0 auto;
      }

      .profile-header {
        margin-bottom: 32px;
      }

      .profile-header h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 900;
        color: var(--primary-dark);
        letter-spacing: -0.08em;
      }

      .profile-card {
        background: rgba(255,255,255,0.68);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 40px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
        margin-bottom: 24px;
      }

      .profile-content {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 40px;
        align-items: start;
      }

      .profile-avatar-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .profile-avatar-wrapper {
        position: relative;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid var(--primary);
        background: linear-gradient(135deg, rgba(122, 74, 232, 0.1), rgba(122, 74, 232, 0.05));
        display: grid;
        place-items: center;
      }

      .profile-avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .avatar-upload-label {
        position: absolute;
        inset: 0;
        cursor: pointer;
        background: rgba(0,0,0,0);
        transition: background 0.2s ease;
        display: grid;
        place-items: center;
      }

      .avatar-upload-label:hover {
        background: rgba(0,0,0,0.15);
      }

      .profile-avatar-actions {
        display: flex;
        gap: 10px;
        width: 100%;
        flex-direction: column;
      }

      .profile-avatar-actions button {
        width: 100%;
        padding: 12px 16px;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 12px;
        border: 1px solid var(--line);
        transition: all 0.2s ease;
      }

      .secondary-btn {
        background: rgba(255,255,255,0.8);
        color: var(--primary);
        border: 1px solid rgba(122, 74, 232, 0.2);
      }

      .secondary-btn:hover {
        background: rgba(122, 74, 232, 0.08);
        border-color: rgba(122, 74, 232, 0.3);
      }

      .danger-btn {
        background: rgba(191, 43, 43, 0.12);
        border: 1px solid rgba(191, 43, 43, 0.2);
        color: var(--cancelled-text);
      }

      .danger-btn:hover {
        background: rgba(191, 43, 43, 0.2);
        border-color: var(--cancelled-text);
      }

      .profile-info-section {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
      }

      .info-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .info-group label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .info-value {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text);
      }

      .status-active {
        color: var(--success-text);
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--primary);
        font-weight: 600;
        transition: all 0.2s ease;
        text-decoration: none;
        cursor: pointer;
        font-size: 0.9rem;
        margin-bottom: 24px;
      }

      .back-button:hover {
        background: rgba(122, 74, 232, 0.08);
        border-color: rgba(122, 74, 232, 0.2);
      }

      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(120px);
        background: rgba(0,0,0,0.88);
        color: #fff;
        padding: 14px 20px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        pointer-events: none;
        transition: transform 0.3s ease;
        z-index: 1000;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 768px) {
        .profile-content {
          grid-template-columns: 1fr;
        }

        .profile-info-section {
          grid-template-columns: 1fr;
        }

        .profile-card {
          padding: 24px;
        }

        .main-panel {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand" aria-label="Marca do sistema">
          <span class="brand-mark" aria-hidden="true"></span>
        </div>

        <nav class="nav" aria-label="Menu principal">
          <button class="nav-item" data-target="professor.html" type="button">
            <span class="nav-icon home" aria-hidden="true"></span>
            <span class="nav-item-text">Início</span>
          </button>
          <button class="nav-item" data-target="professor.html" type="button">
            <span class="nav-icon list" aria-hidden="true"></span>
            <span class="nav-item-text">Meus chamados</span>
          </button>
          <button class="nav-item" data-target="professor.html" type="button">
            <span class="nav-icon plus" aria-hidden="true"></span>
            <span class="nav-item-text">Abrir chamado</span>
          </button>
          <button class="nav-item active" data-target="professor-perfil.html" type="button">
            <span class="nav-icon user" aria-hidden="true"></span>
            <span class="nav-item-text">Perfil</span>
          </button>
        </nav>
      </aside>

      <main class="content">
        <header class="header">
          <div class="header-tools">
            <button class="bell" id="notificationsBtn" type="button" aria-label="Notificações"></button>
            <div class="user-pill" id="userMenuToggle" tabindex="0" aria-label="Menu de perfil">
              <span class="avatar" aria-hidden="true"></span>
              <span id="userName">Professor</span>
            </div>
          </div>
        </header>

        <section class="main-panel">
          <button class="back-button" onclick="window.history.back()">← Voltar</button>

          <div class="profile-container">
            <div class="profile-header">
              <h1>Meu Perfil</h1>
            </div>

            <div class="profile-card">
              <div class="profile-content">
                <div class="profile-avatar-section">
                  <div class="profile-avatar-wrapper">
                    <img id="profileAvatarImage" class="profile-avatar" src="" alt="Foto de perfil" />
                    <label class="avatar-upload-label" for="profilePhotoInput" aria-label="Alterar foto de perfil"></label>
                    <input id="profilePhotoInput" type="file" accept="image/*" hidden />
                  </div>
                  <div class="profile-avatar-actions">
                    <button id="uploadPhotoBtn" class="secondary-btn" type="button">Alterar foto</button>
                    <button id="removePhotoBtn" class="danger-btn" type="button">Remover foto</button>
                  </div>
                </div>

                <div class="profile-info-section">
                  <div class="info-group">
                    <label>Nome Completo</label>
                    <p id="profileName" class="info-value">—</p>
                  </div>
                  <div class="info-group">
                    <label>Email</label>
                    <p id="profileEmail" class="info-value">—</p>
                  </div>
                  <div class="info-group">
                    <label>Função</label>
                    <p id="profileRole" class="info-value">Professor</p>
                  </div>
                  <div class="info-group">
                    <label>Status</label>
                    <p id="profileStatus" class="info-value status-active">Ativo</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>

    <script>
      const user = JSON.parse(localStorage.getItem('helpium_logged_user') || 'null');

      if (!user || user.role !== 'professor') {
        window.location.href = 'index.html';
      }

      const PROFILE_PHOTO_STORAGE_KEY = 'helpium_professor_photo';
      const profileAvatarImage = document.getElementById('profileAvatarImage');
      const profilePhotoInput = document.getElementById('profilePhotoInput');
      const uploadPhotoBtn = document.getElementById('uploadPhotoBtn');
      const removePhotoBtn = document.getElementById('removePhotoBtn');

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timeoutId);
        showToast.timeoutId = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function loadProfilePhoto() {
        const savedPhoto = localStorage.getItem(PROFILE_PHOTO_STORAGE_KEY);
        if (savedPhoto) {
          profileAvatarImage.src = savedPhoto;
          removePhotoBtn.style.display = 'block';
        } else {
          removePhotoBtn.style.display = 'none';
        }
      }

      function saveProfilePhoto(dataUrl) {
        localStorage.setItem(PROFILE_PHOTO_STORAGE_KEY, dataUrl);
        profileAvatarImage.src = dataUrl;
        removePhotoBtn.style.display = 'block';
        showToast('Foto de perfil atualizada com sucesso!');
      }

      uploadPhotoBtn.addEventListener('click', () => {
        profilePhotoInput.click();
      });

      profilePhotoInput.addEventListener('change', (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          showToast('Selecione uma imagem válida.');
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          saveProfilePhoto(dataUrl);
        };
        reader.readAsDataURL(file);
      });

      removePhotoBtn.addEventListener('click', () => {
        localStorage.removeItem(PROFILE_PHOTO_STORAGE_KEY);
        profileAvatarImage.src = '';
        removePhotoBtn.style.display = 'none';
        profilePhotoInput.value = '';
        showToast('Foto de perfil removida.');
      });

      function loadProfileInfo() {
        const user = JSON.parse(localStorage.getItem('helpium_logged_user') || 'null');
        if (!user) return;

        document.getElementById('profileName').textContent = user.name || '—';
        document.getElementById('profileEmail').textContent = user.email || '—';
        document.getElementById('userName').textContent = user.name || 'Professor';
      }

      // Sidebar expand/collapse
      const pageShell = document.querySelector('.page-shell');
      const sidebar = document.querySelector('.sidebar');

      function setSidebarExpanded(isExpanded) {
        pageShell.classList.toggle('is-expanded', isExpanded);
      }

      sidebar.addEventListener('mouseenter', () => setSidebarExpanded(true));
      sidebar.addEventListener('mouseleave', () => setSidebarExpanded(false));

      document.querySelectorAll('.nav-item').forEach((button) => {
        button.addEventListener('click', () => {
          const target = button.dataset.target;
          if (target && target !== 'professor-perfil.html') {
            window.location.href = target;
          }
        });
      });

      // Initialize
      loadProfilePhoto();
      loadProfileInfo();
    </script>
  </body>
</html>
