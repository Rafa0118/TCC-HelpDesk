<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpium | Início</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f4ff;
        font-family: "Inter", sans-serif;
        color: #1d1d1d;
      }

      .home-card {
        width: min(600px, calc(100% - 40px));
        background: #ffffff;
        border: 1px solid rgba(111, 46, 232, 0.12);
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(96, 67, 170, 0.1);
        padding: 48px 32px;
        text-align: center;
      }

      .home-card h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.06em;
      }

      .home-card p {
        margin: 0 0 24px;
        color: rgba(17, 17, 17, 0.7);
        font-size: 1rem;
      }

      .logout-btn {
        border: none;
        background: linear-gradient(135deg, #7c3cf0 0%, #6d2de8 100%);
        color: #fff;
        border-radius: 12px;
        padding: 0.9rem 1.4rem;
        font-size: 0.96rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="home-card">
      <h1>Bem-vindo</h1>
      <p id="welcome-text">Carregando...</p>
      <button class="logout-btn" type="button" onclick="logout()">Sair</button>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem('helpium_logged_user') || 'null');
      const welcome = document.getElementById('welcome-text');

      if (!user) {
        window.location.href = 'index.html';
      } else {
        welcome.textContent = `Olá, ${user.name || user.email}!`;
      }

      function logout() {
        localStorage.removeItem('helpium_logged_user');
        window.location.href = 'index.html';
      }
    </script>
  </body>
</html>
